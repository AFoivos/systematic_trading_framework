evidence_roles:
  DISCOVERY:
    purpose: Reused development data for explicitly post-hoc hypothesis generation and screening.
    access: DISCOVERY_INTERFACE_ONLY
  VALIDATION:
    purpose: Separately authorized validation of a later frozen candidate only.
    access: VALIDATION_INTERFACE_ONLY
  HISTORICAL_PSEUDO_OOS:
    purpose: Historical diagnostics only; never untouched final evidence.
    access: HISTORICAL_DIAGNOSTIC_ONLY
  PROSPECTIVE_FINAL:
    purpose: Separately collected post-freeze observations under a restarted prospective clock.
    access: SEPARATE_EXPLICIT_ONLY

features:
  - name: log_returns
    windows: [48]
    available_at: {bar_offset: 0, event: CLOSE}
  - name: path_efficiency
    windows: [48]
    available_at: {bar_offset: 0, event: CLOSE}
  - name: realized_volatility
    windows: [48]
    available_at: {bar_offset: 0, event: CLOSE}
  - name: spread_fraction
    windows: []
    available_at: {bar_offset: 0, event: CLOSE}

horizons: [16, 32, 64]

