schema_version: 1
pipeline:
  kind: alpha_discovery_v1
  stage: PRE_SIGNAL_RESEARCH
research_id: AR-0001
status: SPECIFICATION_ONLY
specification_hash: e04d48ae21b812aedc0d2c0060855f92becdc13f6cd1c387d04652d550acfe09

approval:
  approved_to_run: false
  approved_by: null
  approved_at: null
  approved_specification_hash: null

scientific_contract:
  role_assignment: IMMUTABLE_PER_SNAPSHOT
  validation_contamination: MODIFICATION_AFTER_VIEW_REQUIRES_NEW_VALIDATION
  prospective_clock: MATERIAL_CHANGE_RESTARTS_CLOCK
  material_changes:
    - FEATURE_DEFINITIONS
    - FEATURE_WINDOWS
    - BINS
    - HORIZONS
    - COSTS
    - HYPOTHESIS_CONDITIONS
    - PROMOTION_GATES
    - EXECUTION_SEMANTICS

snapshot_reference:
  snapshot_id: ETHUSD-30M-CANONICAL-V1
  manifest_path: data/research_snapshots/ETHUSD-30M-CANONICAL-V1/manifest.json
  source_path: data/raw/dukascopy_ethusd_30m_canonical_v1/ethusd_30m_canonical.csv
  expected_sha256: 83d182c98ccbb225220eac02b1bae57917e3b2d2feee5929c53d57c8abaf4202
  evidence_role: DISCOVERY
  source_classification: VALIDATED_MARKET_DATA
  legacy_classifications: []
  readiness: ELIGIBLE

evidence_roles:
  DISCOVERY:
    purpose: Hypothesis discovery, exploratory feature states, and discovery-fitted bins.
    access: DISCOVERY_INTERFACE_ONLY
  VALIDATION:
    purpose: Validation of a frozen hypothesis and frozen bin edges only.
    access: VALIDATION_INTERFACE_ONLY
  HISTORICAL_PSEUDO_OOS:
    purpose: Previously inspected historical diagnostics; never untouched final evidence.
    access: HISTORICAL_DIAGNOSTIC_ONLY
  PROSPECTIVE_FINAL:
    purpose: Post-freeze observations collected after the prospective clock starts.
    access: SEPARATE_EXPLICIT_ONLY

features:
  - name: log_returns
    windows: [1, 4, 16, 48]
    available_at: {bar_offset: 0, event: CLOSE}
  - name: path_efficiency
    windows: [8, 16, 48]
    available_at: {bar_offset: 0, event: CLOSE}
  - name: realized_volatility
    windows: [16, 48, 192]
    available_at: {bar_offset: 0, event: CLOSE}
  - name: normalized_range
    windows: []
    available_at: {bar_offset: 0, event: CLOSE}
  - name: close_location
    windows: []
    available_at: {bar_offset: 0, event: CLOSE}
  - name: utc_hour
    windows: []
    available_at: {bar_offset: 0, event: CLOSE}
  - name: weekday
    windows: []
    available_at: {bar_offset: 0, event: CLOSE}

horizons: [1, 2, 4, 8, 16, 32]

targets_planned:
  - name: mid_close_to_close
    status: IMPLEMENTED_PHASE_3
    entry_available_at: {bar_offset: 0, event: CLOSE}
  - name: next_open_to_future_open
    status: IMPLEMENTED_PHASE_3
    entry_available_at: {bar_offset: 1, event: OPEN}
  - name: executable_long
    status: IMPLEMENTED_PHASE_3
    entry_available_at: {bar_offset: 1, event: OPEN}
  - name: executable_short
    status: IMPLEMENTED_PHASE_3
    entry_available_at: {bar_offset: 1, event: OPEN}
  - name: future_realized_volatility
    status: IMPLEMENTED_PHASE_3
    entry_available_at: {bar_offset: 0, event: CLOSE}
  - name: mfe
    status: IMPLEMENTED_PHASE_3
    entry_available_at: {bar_offset: 1, event: OPEN}
  - name: mae
    status: IMPLEMENTED_PHASE_3
    entry_available_at: {bar_offset: 1, event: OPEN}

conditional_analysis:
  bins: DISCOVERY_FITTED_QUINTILES
  freeze_bin_edges: true
  one_dimensional_states: true
  two_dimensional_interactions:
    - [path_efficiency, realized_volatility]
  allow_3d: false

execution_measurement:
  state_available_at: CLOSE_T
  entry: OPEN_T_PLUS_1
  exit: OPEN_T_PLUS_H_PLUS_1
  quote_source: ACTUAL_DUKASCOPY_BID_ASK
  net_cost_scope: OBSERVED_BID_ASK_SPREAD_ONLY
  additional_costs:
    commission: NOT_INCLUDED_NO_FROZEN_ASSUMPTION
    slippage: NOT_INCLUDED_NO_FROZEN_ASSUMPTION
    swap: NOT_INCLUDED_NO_FROZEN_ASSUMPTION

statistics:
  inference_target: EXECUTABLE_RETURN
  net_cost_scope: OBSERVED_BID_ASK_SPREAD_ONLY
  minimum_observations: 30
  block_bootstrap:
    method: CIRCULAR_MOVING_BLOCK
    block_length_bars: 48
    resamples: 2000
    confidence_level: 0.95
    seed: 7
  chronological_stability:
    partition: EQUAL_OBSERVATION_COUNT
    block_count: 6

multiple_testing:
  family_definition:
    - feature_family
    - horizon
    - target
    - direction
    - preregistered_interaction
  methods: [BH, BY]
  status: IMPLEMENTED_PHASE_3

promotion_gates:
  coverage:
    contract: Complete common timestamp coverage with no hidden join loss.
    status: NOT_EVALUATED
  effect_size:
    contract: Minimum economically meaningful effect must be preregistered before validation.
    status: NOT_EVALUATED
  temporal_stability:
    contract: Direction and magnitude must remain stable across frozen chronological partitions.
    status: NOT_EVALUATED
  execution_realism:
    contract: Side-aware bid/ask costs, delay, slippage, commission, and swap must be defined.
    status: NOT_EVALUATED
  multiple_testing:
    contract: Hierarchical family and planned BH/BY decision rule must be frozen.
    status: NOT_EVALUATED
  prospective_confirmation:
    contract: Final promotion requires untouched post-freeze prospective evidence.
    status: NOT_EVALUATED

artifacts:
  output_root: logs/experiments/alpha_discovery
  layout_version: 1
  write_mode: IMMUTABLE_RUN_DIRECTORY

runtime:
  perform_alpha_calculation: false
  run_backtests: false
  access_prospective_final: false

blockers:
  - Explicit APPROVED_TO_RUN authorization has not been issued.
