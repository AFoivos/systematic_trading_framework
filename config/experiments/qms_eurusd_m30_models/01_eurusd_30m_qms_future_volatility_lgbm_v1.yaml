strategy:
  name: EURUSD M30 QMS Future Volatility Forecast
  version: 1
  symbol: EURUSD
  timeframe: M30
  direction: diagnostic
  description: >
    Causal LightGBM forecast of the next eight hours of realized volatility.
    This experiment is diagnostic only and deliberately emits a flat signal.

data:
  source: dukascopy_csv
  interval: 30m
  start: "2020-01-01"
  end: "2026-04-27"
  alignment: inner
  symbol: EURUSD
  pit:
    timestamp_alignment: {source_timezone: UTC, output_timezone: UTC, normalize_daily: false, duplicate_policy: last}
    corporate_actions: {policy: none, adj_close_col: adj_close}
    universe_snapshot: {inactive_policy: raise}
  storage:
    mode: cached_only
    dataset_id: eurusd_30m_qms_future_volatility_lgbm_v1
    save_raw: false
    save_processed: true
    load_path: data/raw/dukascopy_30m_clean/eurusd_30m.csv
    raw_dir: data/raw
    processed_dir: data/processed/qms_eurusd_m30_models

features: &qms_features
- step: returns
  params: {log: false, col_name: close_ret}
- step: atr
  params: {high_col: high, low_col: low, close_col: close, window: 48, windows: [48], method: wilder, add_over_price: false, atr_col: atr_48}
  transforms:
    ratio:
      enabled: true
      items: [{numerator_col: atr_48, denominator_col: close, output_col: atr_over_price_48}]
- step: quant_market_state
  params: {preset: balanced, kds_config: null, rlvs_config: null, lmds_config: null, bar_minutes: 30.0, inplace: false}

model:
  kind: lightgbm_regressor
  feature_cols: &qms_model_features
  - close_ret
  - atr_over_price_48
  - ktrend_score
  - ktrend_uncertainty
  - kalman_innovation_z
  - kadx_signed
  - rlv_regime_z
  - rlv_shock_z
  - rlv_fast_slow_ratio
  - rlv_vol_of_vol_ratio
  - rlv_term_structure
  - lmom_score
  - lmom_efficiency
  - lmom_persistence
  - lmom_reversal_pressure
  - lmom_exhaustion
  - qms_trend_momentum_alignment
  - qms_state_uncertainty
  - qms_post_gap_age
  - qms_gap_flag
  target:
    kind: future_realized_volatility
    price_col: close
    returns_col: close_ret
    returns_type: simple
    horizon_bars: 16
    annualize: false
    periods_per_year: 12096
    fwd_col: target_future_rv_16
    label_col: target_future_rv_16
    clip: [0.0, 0.02]
  split:
    method: purged
    train_size: 35040
    test_size: 4380
    step_size: 4380
    expanding: true
    max_folds: 8
    purge_bars: 16
    embargo_bars: 16
  params:
    n_estimators: 300
    learning_rate: 0.03
    num_leaves: 15
    max_depth: 5
    min_child_samples: 80
    subsample: 0.85
    colsample_bytree: 0.85
    reg_alpha: 0.25
    reg_lambda: 2.0
    random_state: 7
    n_jobs: 1
    verbosity: -1
  preprocessing: {scaler: none}
  calibration: {}
  use_features: true
  pred_ret_col: pred_future_rv_16
  pred_prob_col: pred_future_rv_high_prob
  pred_is_oos_col: pred_future_rv_16_is_oos

signals: {kind: none, params: {signal_col: signal_no_trade}}
target: {}
validation: {method: purged_walk_forward, purge_bars: 16, embargo_bars: 16}
runtime: {seed: 7, repro_mode: strict, deterministic: true, threads: 1, seed_torch: false}
risk:
  cost_per_turnover: 0.00004
  slippage_per_turnover: 0.00002
  target_vol: null
  max_leverage: 1.0
  sizing: {}
  dd_guard: {enabled: false}
  portfolio_guard: {}
  drawdown_sizing: {}
  vol_col: null
backtest:
  engine: vectorized
  signal_col: signal_no_trade
  returns_col: close_ret
  returns_type: simple
  subset: test
  periods_per_year: 12096
  missing_return_policy: raise_if_exposed
  allow_short: false
  vol_col: null
portfolio: {enabled: false, construction: signal_weights, long_short: false, gross_target: 1.0}
monitoring: {enabled: false, psi_threshold: 0.2, n_bins: 10}
diagnostics: {enabled: true, model: {enabled: true}}
execution: {enabled: false, mode: paper, capital: 100000.0, price_col: close}
logging:
  enabled: true
  run_name: eurusd_30m_qms_future_volatility_lgbm_v1
  output_dir: logs/experiments/qms_eurusd_m30_models
  save_model: false
evaluation: {strict_oos_only: true}
research_metadata:
  family: qms_eurusd_m30_models
  task: future_realized_volatility_forecast
  horizon_bars: 16
  decision_use: volatility_targeting_and_trade_suppression_only
  execution_policy: no_trade_diagnostic
