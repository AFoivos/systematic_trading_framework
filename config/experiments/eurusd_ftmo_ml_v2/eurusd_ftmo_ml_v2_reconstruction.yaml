pipeline:
  kind: eurusd_ftmo_ml_v2
strategy:
  name: eurusd_ftmo_2_step_ml_meta_ensemble_v2
  version: v2
  symbol: EURUSD
  timeframe: 30m
  description: >-
    Documented reconstruction of the fixed four-component pullback plus
    session-fade candidate ensemble with three LightGBM meta-label models.
alpha:
  pullback:
    family_weight: 0.80
    trading_window_utc: ['06:00', '18:00']
    slow_ema_span: 192
    components:
      - {component_id: component_1, ema_span: 16, entry_atr: 2.50, exit_atr: 0.75, maximum_hold_bars: 24, adverse_z_stop: 99.0}
      - {component_id: component_2, ema_span: 20, entry_atr: 2.25, exit_atr: 0.50, maximum_hold_bars: 24, adverse_z_stop: 99.0}
      - {component_id: component_3, ema_span: 12, entry_atr: 2.00, exit_atr: 0.25, maximum_hold_bars: 24, adverse_z_stop: 99.0}
      - {component_id: component_4, ema_span: 20, entry_atr: 3.00, exit_atr: 0.75, maximum_hold_bars: 8, adverse_z_stop: 4.0}
  session_fade:
    family_weight: 0.20
    observation_window_utc: ['00:00', '06:30']
    entry_utc: '07:00'
    exit_utc: '20:00'
    trigger_atr: 2.0
    previous_daily_ema_span: 20
references:
  source_dir: /mnt/data
  destination_dir: artifacts/reference/eurusd_ftmo_ml_v2
data:
  filename: eurusd_30m.csv
  sha256: 384af9b40271f1598a545c79c77303922ed20d257b968c7b4718820accef4164
  expected_rows: 78803
  expected_start: '2020-01-01 22:00:00'
  expected_end: '2026-04-27 23:30:00'
  timezone: UTC
features:
  contract: fixed_151
  missing_value_policy: lightgbm_native_nan
model:
  kind: lightgbm_binary_meta_ensemble
  num_leaves: [3, 7, 15]
  score_floor: 0.60
  score_cap: 0.80
  common_params:
    boosting_type: gbdt
    class_weight: null
    colsample_bytree: 0.60
    importance_type: split
    learning_rate: 0.025
    max_depth: 4
    min_child_samples: 40
    min_child_weight: 0.001
    min_split_gain: 0.0
    n_estimators: 250
    n_jobs: -1
    objective: binary
    random_state: 42
    reg_alpha: 1.0
    reg_lambda: 5.0
    subsample: 0.80
    subsample_for_bin: 200000
    subsample_freq: 0
    verbosity: -1
validation:
  kind: annual_strict_oos
  folds: [2022, 2023, 2024]
  frozen_holdout_train_cutoff: '2025-01-01'
risk:
  base_notional_multiple: 22.0
  drawdown_full_until: -0.025
  drawdown_zero_at: -0.065
  daily_circuit_breaker: -0.0225
  daily_timezone: Europe/Prague
costs:
  pip_size: 0.0001
  commission_pips_per_side: 0.25
  slippage_pips_per_side: 0.05
  spread: observed_bid_ask
runtime:
  deterministic: true
  optimization: false
  rl_models: []
  dl_models: []
logging:
  output_dir: artifacts/experiments/eurusd_ftmo_ml_v2
