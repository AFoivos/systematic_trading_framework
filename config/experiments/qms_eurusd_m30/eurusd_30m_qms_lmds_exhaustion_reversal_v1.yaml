strategy: {name: EURUSD 30m QMS LMDS Exhaustion Reversal, version: 1, symbol: EURUSD, timeframe: M30, direction: long_short}
data:
  source: dukascopy_csv
  interval: 30m
  start: "2020-01-01"
  end: "2026-04-27"
  alignment: inner
  symbol: EURUSD
  pit:
    timestamp_alignment: {source_timezone: UTC, output_timezone: UTC, normalize_daily: false, duplicate_policy: last}
    corporate_actions: {policy: none, adj_close_col: adj_close}
    universe_snapshot: {inactive_policy: raise}
  storage: {mode: cached_only, dataset_id: eurusd_30m_qms_lmds_exhaustion_reversal_v1, save_raw: false, save_processed: true, load_path: data/raw/dukascopy_30m_clean/eurusd_30m.csv, raw_dir: data/raw, processed_dir: data/processed/qms_eurusd_m30}
features:
- step: returns
  params: {log: false, col_name: close_ret}
- step: atr
  params: {high_col: high, low_col: low, close_col: close, window: 48, windows: [48], method: wilder, add_over_price: false, atr_col: atr_48}
  transforms:
    ratio: {enabled: true, items: [{numerator_col: atr_48, denominator_col: close, output_col: atr_over_price_48}]}
- step: quant_market_state
  params: {preset: balanced, kds_config: null, rlvs_config: null, lmds_config: null, bar_minutes: 30.0, inplace: false}
model:
  kind: none
  split: {method: purged, purge_bars: 64, embargo_bars: 64}
signals:
  kind: qms_alpha_strategy
  params:
    strategy: lmds_exhaustion_reversal
    mode: long_short
    lookback_bars: 4032
    min_periods: 1008
    setup_lookback_bars: 8
    signal_on_crossing: true
    trend_col: ktrend_score
    momentum_col: lmom_score
    efficiency_col: lmom_efficiency
    reversal_pressure_col: lmom_reversal_pressure
    exhaustion_col: lmom_exhaustion
    shock_col: rlv_shock_z
    gap_flag_col: qms_gap_flag
    unexpected_gap_col: qms_unexpected_data_gap
    trend_strength_quantile: 0.70
    reversal_pressure_quantile: 0.90
    exhaustion_quantile: 0.90
    efficiency_quantile: 0.40
    shock_quantile: 0.70
    signal_col: qms_alpha_signal
    candidate_col: qms_alpha_candidate
    state_col: qms_alpha_state
    direction_col: qms_alpha_direction
    ready_col: qms_alpha_threshold_ready
target: {kind: triple_barrier, price_col: close, open_col: open, high_col: high, low_col: low, volatility_col: atr_over_price_48, label_mode: meta, side_col: qms_alpha_signal, candidate_col: qms_alpha_candidate, candidate_mode: all_nonzero, entry_price_mode: next_open, max_holding: 12, upper_mult: 1.75, lower_mult: 1.25, vol_window: 48, min_vol: 0.00002, neutral_label: lower, tie_break: closest_to_open, add_r_multiple: true}
validation: {method: purged_walk_forward, purge_bars: 64, embargo_bars: 64}
runtime: {seed: 7, repro_mode: strict, deterministic: true, threads: 1, seed_torch: false}
risk: {cost_per_turnover: 0.00004, slippage_per_turnover: 0.00002, target_vol: null, max_leverage: 1.0, sizing: {}, dd_guard: {enabled: false}, portfolio_guard: {}, drawdown_sizing: {}, vol_col: null}
backtest: {engine: manual_barrier, signal_col: qms_alpha_signal, returns_col: close_ret, returns_type: simple, subset: full, periods_per_year: 12096, missing_return_policy: raise_if_exposed, allow_short: true, stop_mode: volatility_stop, vol_col: atr_over_price_48, open_col: open, high_col: high, low_col: low, close_col: close, take_profit_r: 1.75, stop_loss_r: 1.25, risk_per_trade: 0.0025, max_holding_bars: 12, dynamic_exits: {enabled: false}, partial_exits: {enabled: false}}
portfolio: {enabled: false, construction: signal_weights, long_short: true, gross_target: 1.0}
monitoring: {enabled: false, psi_threshold: 0.2, n_bins: 10}
diagnostics:
  enabled: true
  robustness: {enabled: true, cost_multipliers: [1.0, 2.0, 3.0], entry_delay_bars: [1, 2], walk_forward_frequency: YE}
execution: {enabled: false, mode: paper, capital: 100000.0, price_col: close}
logging: {enabled: true, run_name: eurusd_30m_qms_lmds_exhaustion_reversal_v1, output_dir: logs/experiments/qms_eurusd_m30, save_model: false}
evaluation: {strict_oos_only: false}
research_metadata: {family: qms_eurusd_m30_alpha_hypotheses, hypothesis: lmds_exhaustion_reversal, threshold_policy: rolling_past_only}
