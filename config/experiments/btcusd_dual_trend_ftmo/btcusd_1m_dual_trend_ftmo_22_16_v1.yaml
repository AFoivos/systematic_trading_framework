pipeline:
  kind: btcusd_dual_trend_ftmo_v1

strategy:
  name: btcusd_dual_trend_ensemble_ftmo_22_16
  version: v1
  symbol: BTCUSD
  source_timeframe: 1m
  execution_timeframe: 30m
  description: >-
    Deterministic 60/40 EMA and persistent Donchian trend ensemble,
    volatility targeted and evaluated with a phase-aware FTMO two-step
    research simulator.

data:
  source: dukascopy_csv
  interval: 1m
  symbol: BTCUSD
  start: null
  end: null
  pit:
    timestamp_alignment:
      source_timezone: UTC
      output_timezone: UTC
      normalize_daily: false
      duplicate_policy: raise
    corporate_actions:
      policy: none
  storage:
    mode: cached_only
    load_path: data/raw/dukascopy_30m_clean/btcusd_1m.csv
    save_raw: false
    save_processed: true
    raw_dir: data/raw
    processed_dir: data/processed

aggregation:
  timeframe: 30min
  label: right
  closed: right
  open_aggregation: first
  high_aggregation: max
  low_aggregation: min
  close_aggregation: last
  volume_aggregation: sum
  empty_bin_policy: drop

features:
  - step: btcusd_dual_trend_30m
    params:
      open_col: open
      high_col: high
      low_col: low
      close_col: close
      volume_col: volume
      ema_fast_span: 96
      ema_slow_span: 672
      donchian_window: 336
      volatility_ewma_span: 336
      periods_per_year: 17520
      ema_weight: 0.60
      donchian_weight: 0.40
      execution_return_mode: next_open_to_next_open
      adverse_excursion_mode: next_30m_high_low
    outputs:
      ema_fast: dual_ema_fast_96
      ema_slow: dual_ema_slow_672
      ema_signal: dual_ema_signal
      prior_high: dual_prior_high_336
      prior_low: dual_prior_low_336
      donchian_state: dual_donchian_state
      ensemble_signal: dual_trend_score
      volatility_ann: dual_volatility_ann_336
      execution_return: dual_execution_return
      adverse_long_return: dual_adverse_long_return
      adverse_short_price_return: dual_adverse_short_price_return

model:
  kind: none

signals:
  kind: btcusd_dual_trend_ensemble
  params:
    ensemble_col: dual_trend_score
    volatility_col: dual_volatility_ann_336
    target_volatility: 0.22
    max_leverage: 1.50
    rebalance_bars: 48
    allow_short: true
    signal_col: signal_position

target:
  kind: none

risk:
  target_vol: null
  max_leverage: 1.50
  cost_per_turnover: 0.0004
  slippage_per_turnover: 0.0
  dd_guard:
    enabled: false
  sizing:
    kind: none

backtest:
  engine: btcusd_dual_trend_ftmo
  signal_col: signal_position
  returns_col: dual_execution_return
  returns_type: simple
  periods_per_year: 17520
  annualization_mode: fixed_periods
  allow_short: true
  rebalance_bars: 48
  liquidate_at_end: true
  missing_return_policy: raise_if_exposed

ftmo:
  rules_web_verified: false
  daily_timezone: UTC
  phase1:
    profit_target: 0.10
    target_volatility: 0.22
    max_leverage: 1.50
  phase2:
    profit_target: 0.05
    target_volatility: 0.16
    max_leverage: 1.20
  maximum_daily_loss: 0.05
  maximum_total_loss: 0.10
  minimum_trading_days_per_phase: 4
  time_limit_days: null
  rolling_start:
    start: 2026-01-05
    end: 2026-04-13
    frequency: 7D
  evaluation_end_exclusive: 2026-07-28
  intrabar_check: next_30m_high_low

evaluation:
  development:
    start: 2026-01-01
    end_exclusive: 2026-06-01
  legacy_holdout:
    start: 2026-06-01
    end_exclusive: 2026-07-28
    pristine: false
  combined:
    start: 2026-01-01
    end_exclusive: 2026-07-28
  cost_stress_bps: [0, 8, 12, 16, 20]
  parameter_neighborhood:
    ema_weights: [0.50, 0.60, 0.75]
    volatility_spans: [192, 336]
    target_volatilities: [0.20, 0.22]

runtime:
  seed: 7
  deterministic: true
  threads: 1

validation:
  pit_hardening: true
  data_quality_audit: true
  target_backtest_parity_required: true
  causality_tests_required: true

logging:
  enabled: true
  run_name: btcusd_1m_dual_trend_ftmo_22_16_v1
  output_dir: logs/experiments/btcusd_dual_trend_ftmo
